name: 🤖 Build & Release DroidPhone IPA

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - "v*.*.*"          # e.g.  v1.0.0  →  triggers a release
  workflow_dispatch:      # manual trigger from GitHub UI
    inputs:
      version:
        description: "Version tag (e.g. v1.0.2)"
        required: true
        default: "v1.0.2"
      prerelease:
        description: "Mark as pre-release?"
        type: boolean
        default: false

# ─────────────────────────────────────────────────────────────────────────────
# Permissions
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: write   # needed to create GitHub Releases and upload assets

# ─────────────────────────────────────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ══════════════════════════════════════════════════════════════════════════
  # Job 1 — Build QEMU & Android Emulation Engine for iOS (arm64)
  # ══════════════════════════════════════════════════════════════════════════
  build-qemu:
    name: 🔨 Build QEMU Engine for iOS
    runs-on: macos-14          # Apple M-series runner (arm64, Xcode 15)
    timeout-minutes: 30

    steps:
      - name: ⬇ Checkout
        uses: actions/checkout@v4

      - name: 🐍 Install Python dependencies (distlib, setuptools, wheel)
        run: |
          python3 -m pip install --break-system-packages distlib setuptools wheel 2>/dev/null || \
          pip3 install --break-system-packages distlib setuptools wheel 2>/dev/null || true

      - name: 🏗 Build QEMU Emulation Library for iOS
        run: |
          chmod +x scripts/build_qemu_ios.sh
          ./scripts/build_qemu_ios.sh

      - name: 📤 Upload libqemu-ios.a artifact
        uses: actions/upload-artifact@v4
        with:
          name: libqemu-ios
          path: DroidPhone/QEMU/lib/libqemu-ios.a
          retention-days: 1

  # ══════════════════════════════════════════════════════════════════════════
  # Job 2 — Build Xcode project and package IPA
  # ══════════════════════════════════════════════════════════════════════════
  build-ipa:
    name: 📱 Build DroidPhone.ipa
    needs: build-qemu
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: ⬇ Checkout
        uses: actions/checkout@v4

      - name: 📥 Download libqemu-ios.a
        uses: actions/download-artifact@v4
        with:
          name: libqemu-ios
          path: DroidPhone/QEMU/lib/

      - name: 🍺 Install xcbeautify
        run: brew install xcbeautify || true

      - name: 🔧 Select latest Xcode
        run: |
          LATEST=$(ls /Applications | grep -E '^Xcode_[0-9]' | sort -V | tail -1)
          echo "Using Xcode: /Applications/${LATEST}"
          sudo xcode-select -s "/Applications/${LATEST}/Contents/Developer"

      - name: 📋 Show Xcode / Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: 🏗 Archive DroidPhone
        run: |
          xcodebuild archive \
            -project DroidPhone.xcodeproj \
            -scheme  DroidPhone \
            -configuration Release \
            -archivePath "${{ runner.temp }}/DroidPhone.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_COMPILATION_MODE=wholemodule \
            GCC_OPTIMIZATION_LEVEL=s

      - name: 📦 Package IPA for Sideloading (AltStore / TrollStore / Sideloadly)
        run: |
          mkdir -p "${{ runner.temp }}/ipa/Payload"
          APP_PATH=$(find "${{ runner.temp }}/DroidPhone.xcarchive/Products/Applications" -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found compiled app bundle at: ${APP_PATH}"
          cp -r "${APP_PATH}" "${{ runner.temp }}/ipa/Payload/"
          cd "${{ runner.temp }}/ipa"
          zip -qry "DroidPhone.ipa" Payload
          ls -lh DroidPhone.ipa

      - name: 🗜 Rename IPA with version
        id: rename
        run: |
          VERSION="${{ github.ref_name }}"
          [ -z "${VERSION}" ] && VERSION="${{ github.event.inputs.version }}"
          [ -z "${VERSION}" ] && VERSION="v0.0.0-dev"
          IPA_NAME="DroidPhone-${VERSION}.ipa"
          mv "${{ runner.temp }}/ipa/DroidPhone.ipa" "${{ runner.temp }}/ipa/${IPA_NAME}"
          echo "ipa_name=${IPA_NAME}" >> "$GITHUB_OUTPUT"
          echo "ipa_path=${{ runner.temp }}/ipa/${IPA_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidPhone-IPA
          path: ${{ steps.rename.outputs.ipa_path }}
          retention-days: 7

      # ── Publish to GitHub Releases (runs on tag push OR manual dispatch) ──
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.rename.outputs.version }}
          name:       "DroidPhone ${{ steps.rename.outputs.version }}"
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## 🤖 DroidPhone ${{ steps.rename.outputs.version }} — Android Emulator for iPhone

            Run **Android 4 through 11** on your iPhone powered by QEMU hardware-level emulation.

            ### 📱 Supported Android Releases
            | Version | API | Codename | Status |
            |---------|-----|----------|--------|
            | 4.4 | 19 | KitKat | ✅ Stable |
            | 5.1 | 22 | Lollipop | ✅ Stable |
            | 6.0 | 23 | Marshmallow | ✅ Stable |
            | 7.1 | 25 | Nougat | ✅ Stable |
            | 8.1 | 27 | Oreo | ✅ Stable |
            | 9.0 | 28 | Pie | ✅ Stable |
            | 10  | 29 | Q | ✅ Stable |
            | 11  | 30 | R | ✅ Stable |

            ### ⚡ Features
            - **No Jailbreak Required** — Sideload via AltStore, Sideloadly, or TrollStore
            - **Metal GPU Accelerated** — 30/60 FPS rendering pipeline
            - **Persistent Storage** — virtio-blk QCOW2 sparse disk images
            - **Full Touch Support** — Absolute USB tablet pointer forwarding
            - **Navigation Controls** — Dedicated Back, Home, Recent Apps, and Power toolbar

            ### 📥 Sideload Installation
            1. Download `${{ steps.rename.outputs.ipa_name }}` below.
            2. Open with **AltStore**, **Sideloadly**, or **TrollStore** to install.
            3. On first launch, pick your Android version (KitKat → Android 11) and launch!

            ---
            *Built automatically via GitHub Actions (macOS Apple Silicon runner)*
          files: ${{ steps.rename.outputs.ipa_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════════════════
  # Job 3 — Notify
  # ══════════════════════════════════════════════════════════════════════════
  notify:
    name: ✅ Release Summary
    needs: build-ipa
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Print result
        run: |
          echo "Build status: ${{ needs.build-ipa.result }}"
          echo "IPA published to GitHub Releases ✅"
